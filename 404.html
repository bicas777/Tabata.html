<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Página não encontrada — Enzo Bicalho Creative Portfolio." />
    <title>404 — Enzo Bicalho</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      @font-face {
        font-family:'JetBrains';font-style:normal;font-weight:400;src:url('assets/fonts/JetBrainsMono/JetBrainsMonoNLNerdFontMono-Regular.ttf') format('truetype');
      }
      @font-face {
        font-family:'JetBrains';font-style:normal;font-weight:600;src:url('assets/fonts/JetBrainsMono/JetBrainsMonoNLNerdFontMono-SemiBold.ttf') format('truetype');
      }
    </style>
    <link rel="stylesheet" href="style.css" />
    <style>
      :root { --ink:#e9f7ff; --ice:#020711; --mist:#101e30; --line:rgba(207,239,255,.18); --glass-bg:rgba(8,20,38,.6); --glass-border:rgba(140,210,240,.3); --glass-highlight:rgba(255,255,255,.16); --glass-shadow:rgba(0,0,0,.45); --glass-shadow-strong:rgba(0,0,0,.6); }
      .not-found { min-height:100svh; display:grid; place-items:center; padding:0 3rem; background:linear-gradient(152deg,#0a1b30 0%,#163b5b 48%,#09182d 100%); }
      .not-found__content { text-align:center; max-width:720px; margin:auto; }
      .not-found__number { font:800 clamp(12rem,40vw,18rem)/.7 var(--display); letter-spacing:-.14em; background:linear-gradient(145deg,#9fe8ff 0%,#2f7fb8 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin:0; }
      .not-found__title { font:800 clamp(2rem,5vw,3.5rem)/.9 var(--display); letter-spacing:-.06em; margin:2rem 0 .5rem; color:var(--ink); }
      .not-found__copy { font:500 1rem/1.6 var(--mono); letter-spacing:.06em; color:rgba(232,247,255,.72); margin:0 0 2rem; }
      .not-found .round-link { margin:auto; }
    </style>
  </head>
  <body>
    <div class="not-found">
      <div class="not-found__content">
        <p class="not-found__number">404</p>
        <h1 class="not-found__title">Página não encontrada</h1>
        <p class="not-found__copy">Parece que você se perdeu. Mas não se preocupe — volte para o início e explore meu trabalho.</p>
        <a class="round-link" href="index.html" data-cursor-label="INÍCIO"><span>INÍCIO</span><i>↗</i></a>
      </div>
    </div>
  </body>
</html>
