<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Google Font Orbitron -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="pedido.css">
</head>
<body>

<canvas id="particles"></canvas>
<canvas id="matrix"></canvas>
<div class="mouse-blur"></div>

<!-- Hero fixo -->
<div class="hero-top">
    <h1 id="titulo">Solicitar Pedido</h1>
</div>

<!-- Formulário -->
<div class="section-content first-section">
    <div class="form-container">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Seu nome ou nickname" required>

        <label for="email">Email:</label>
        <input type="text" id="email" placeholder="Seu email" required>

        <label>Escolha o serviço:</label>
        <div class="services">
            <div class="service-card" data-service="Thumbnail">Thumbnail</div>
            <div class="service-card" data-service="Código">Código</div>
            <div class="service-card" data-service="Anuncio">Anuncio</div>
        </div>

        <label for="detalhes">Detalhes do pedido:</label>
        <textarea id="detalhes" rows="5" placeholder="Descreva como deseja o pedido" required></textarea>

        <button id="enviar">Enviar Pedido</button>
        <p id="status"></p>
    </div>
</div>

<script src="pedido.js"></script>
</body>
</html>
