<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja Mobile - Tabata</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Google Font Orbitron -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">

<!-- CSS Shop Mobile -->
<link rel="stylesheet" href="shop-mobile.css">

<!-- Vercel Web Analytics -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<!-- Fundos fixos -->
<canvas id="matrix"></canvas>

<!-- Título da Loja -->
<div class="hero-top">
    <h1>Loja Tabata</h1>
    <p>Escolha seu produto!</p>
</div>

<!-- Produtos -->
<div class="shop-container">
    <div class="product-card">
        <img src="assets/fundo-esquerda.jpg" alt="Produto 1">
        <h2>Thumbnail Profissional</h2>
        <p>THUMB: R$40  ANUNCIO: R$70</p>
        <p>THUMBMAKER FIXO: R$25 por thumb</p>
        <button class="btn" onclick="window.open('pedido.html')">
            <i class="fa-solid fa-cart-shopping"></i> Solicitar
        </button>
    </div>

    <div class="product-card">
        <img src="assets/fundo-direita.jpg" alt="Produto 2">
        <h2>Códigos <i class="fa-brands fa-html5 html"></i> <i class="fa-brands fa-python python"></i> <i class="fa-brands fa-square-js js"></i> <i class="fa-brands fa-css3-alt css"></i> Profissionais</h2>
        <p>R$90</p>
        <p>SITES COMPLETOS: R$250-R$3000</p>
        <button class="btn" onclick="window.open('pedido.html')">
            <i class="fa-solid fa-cart-shopping"></i> Solicitar
        </button>
    </div>
</div>

<!-- Footer -->
<footer class="footer">
    <div class="footer-buttons">
        <button class="btn" onclick="window.location.href='suporte.html'">
            <i class="fa-solid fa-headset"></i> Suporte
        </button>
    </div>
    <p><i class="fa-brands fa-whatsapp"></i>: +55 31 98380-8351</p>
</footer>
