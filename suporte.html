<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabata Suporte</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="suporte.css">
</head>
<body>

<div class="container">
    <img id="img3" src="assets/img3.png" alt="Imagem de suporte" class="top-image">
    <i class="fas fa-headset icon"></i>
    <h1>Tabata Suporte</h1>
    <p>Envie sua solicitação e enviaremos para seu email o mais rápido possível!</p>

    <input type="text" id="nome" placeholder="Seu nome">
    <input type="email" id="email" placeholder="Seu e-mail">
    <textarea id="mensagem" placeholder="Escreva sua mensagem..."></textarea>
    <label id="imagemanexo" for="imagem">Anexar arquivo (opcional):</label>
    <input type="file" id="imagem" accept=".png, .jpg, .jpeg">
    <button id="enviar">Enviar</button>
    <p id="status"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3.2.0/dist/email.min.js"></script>
<script src="suporte.js"></script>
<script>
    emailjs.init("Y27lc6UI_JqbXK-uV"); // Public Key do EmailJS
</script>
</body>
</html>
